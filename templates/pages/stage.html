{{template "base_start" .}}

<div class="page_stage">
    {{with .stage}}
    <h2 class="page_stage__title">{{ .Title }}</h2>
    <div class="page_stage__content">
        <img class="page_stage__image" src="{{ .ImageURL }}" alt="{{ .Title }}">
        <p class="page_stage__description">{{ .Description }}</p>
    </div>
    {{end}}
</div>

{{template "base_end" .}}

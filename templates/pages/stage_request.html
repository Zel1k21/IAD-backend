{{template "base_start" .}}

<div class="page_request">
    <div class="product_name">
        <h2 class = "product_name__title">Введите название товара:</h2>
        {{template "text-input" .stageRequest.ProductName}}
    </div>
</div>
    <div class="page_request__cards">
        {{range .stageRequest.Entries}}
        {{template "stage_card_horizontal_view" .}}
        {{end}}
    </div>
    <div class = "bottom_panel">
        <form action="/stage_request/{{.stageRequest.ID}}" method="post" style="display: inline">
            <input type="hidden" name="request-id" value="{{.stageRequest.ID}}" />
            <button type="submit" class="btn stage_btn">Удалить</button>
        </form>
        <h3 class="stage_result">Итого: {{.stageRequest.EmissionCalculationResult}} т</h3>
    </div>
</div>

{{template "base_end" .}}
